name: Carmera *
description: CARMERA was a New York City based road-intelligence and HD mapping company that provided
  "change-as-a-service" map maintenance for autonomous driving, mobility-as-a-service and consumer navigation.
  It used consumer-grade cameras mounted on commercial fleet vehicles as crowdsourced visual probes to
  detect permanent road inventory change (signs, signals, lane markings) and temporary closure events
  (construction), then regenerated both HD and SD maps in near real time. Its commercial offering was
  described as detection APIs that identify map-impacting events plus vector APIs that deliver map updates,
  layered over a customer-supplied or CARMERA-supplied base map. The company was backed by GV and was
  acquired in July 2021 by Woven Planet (now Woven by Toyota), the advanced mobility subsidiary of Toyota
  Motor Corporation. Its APIs were sold under enterprise agreements and were never published as a public
  developer program; as of this enrichment pass the carmera.com domain no longer resolves and no developer
  portal, documentation, SDK, or API artifact survives.
